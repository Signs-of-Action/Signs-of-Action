<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signs of Action</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #fff;
      color: #222;
      line-height: 1.7;
    }
    main {
      max-width: 780px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
    h1 { font-size: 2.2rem; margin-bottom: 2rem; }
    h1 span { color: #4a7cc7; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 1rem; }
    ul a { font-size: 1.1rem; color: #1a5ca8; text-decoration: underline; font-weight: 600; }
    ul a:hover { color: #c0392b; }
  </style>
</head>
<body>
  <main>
    <h1><span>Signs of Action</span></h1>
    <ul>
      <li><a href="boycott/">Boycott</a></li>
    </ul>
  </main>
</body>
</html>
